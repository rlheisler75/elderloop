<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c90e1" />
    <meta name="description" content="ElderLoop — Senior Living Management Platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ElderLoop" />

    <title>ElderLoop</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[ElderLoop SW] Registered, scope:', reg.scope)

              // Listen for subscription changes
              navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data?.type === 'PUSH_SUBSCRIPTION_CHANGED') {
                  // Dispatch custom event so React can handle re-subscription
                  window.dispatchEvent(new CustomEvent('pushsubscriptionchanged', {
                    detail: event.data.subscription
                  }))
                }
              })
            })
            .catch(err => console.warn('[ElderLoop SW] Registration failed:', err))
        })
      }
    </script>
  </body>
</html>
